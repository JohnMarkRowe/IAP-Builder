<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IAP Builder</title>
<style>
:root{--bg:#f3f5f8;--panel:#fff;--ink:#1b2430;--mut:#667085;--line:#d5dce6;--acc:#1f4e8c;--accink:#fff;--ok:#1a7f4b;--warn:#b54708;--bad:#b42318;--inp:#fff;--soft:#eaf0f8}
@media (prefers-color-scheme:dark){:root{--bg:#0f141b;--panel:#18202b;--ink:#e6ebf2;--mut:#93a1b5;--line:#2b3646;--acc:#5b9bff;--accink:#0b1220;--ok:#4cc38a;--warn:#f0a050;--bad:#ff8a80;--inp:#111821;--soft:#1d2836}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,Segoe UI,Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{background:var(--inp);border:1px solid var(--line);border-radius:6px;padding:7px 9px;width:100%}
textarea{min-height:90px;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
button{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:7px 12px;cursor:pointer;min-height:36px}
button:hover{border-color:var(--acc)}
button.pri{background:var(--acc);color:var(--accink);border-color:var(--acc);font-weight:600}
button.danger{color:var(--bad)}
button.ghost{background:none}
#app{display:grid;grid-template-columns:300px 1fr;min-height:100vh}
#side{background:var(--panel);border-right:1px solid var(--line);padding:14px;position:sticky;top:0;height:100vh;overflow:auto}
#main{padding:0 22px 60px;min-width:0}
.brand{font-weight:700;font-size:18px;margin-bottom:12px}.brand small{display:block;font-weight:400;color:var(--mut);font-size:12px}
.blk{margin-bottom:14px}.lbl{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em;display:block;margin:10px 0 4px}
.row{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.row.end{justify-content:flex-end}
.nav{display:flex;width:100%;text-align:left;align-items:center;gap:8px;border:0;background:none;padding:7px 8px;border-radius:6px;min-height:34px}
.nav:hover{background:var(--soft)}.nav.on{background:var(--soft);font-weight:600;box-shadow:inset 3px 0 var(--acc)}
.nav span{color:var(--mut);font-size:12px;margin-left:auto;text-align:right}
.nav.sub{padding-left:34px;font-size:13px}
.dot{width:10px;height:10px;border-radius:50%;border:2px solid var(--mut);flex:none}
.dot.part{background:var(--ok);border-color:var(--ok)}.dot.auto{border-color:var(--acc);background:var(--acc)}
.top{position:sticky;top:0;background:var(--bg);padding:12px 0;z-index:5;display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:16px}
.top .grow{flex:1;min-width:200px}
.pill{padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600;background:var(--soft)}
.pill.ok{color:var(--ok)}.pill.warn{color:var(--warn)}
h2{margin:6px 0 2px;font-size:22px}.mut{color:var(--mut)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
.f{display:block;margin-bottom:12px}.f>span,.cap{display:block;font-size:13px;font-weight:600;margin-bottom:4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.tw{overflow-x:auto;margin-bottom:8px}
table.et{border-collapse:collapse;width:100%;min-width:560px}
table.et th{font-size:12px;text-align:left;color:var(--mut);padding:4px;white-space:nowrap}
table.et td{padding:3px}table.et td input,table.et td select{min-width:90px}
.ask{border:1px solid var(--line);border-left:4px solid var(--acc);background:var(--panel);border-radius:8px;padding:10px 14px;margin-bottom:16px}
.ask.bad{border-left-color:var(--warn)}.ask b.w{color:var(--warn)}
.alert{border:1px solid var(--warn);border-radius:8px;padding:10px 14px;margin-bottom:14px;background:var(--panel)}
.alert ul{margin:6px 0 0 18px;padding:0}
.rg{display:grid;grid-template-columns:minmax(150px,1.2fr) 130px 1.2fr 1fr 1fr;gap:6px;align-items:center;margin-bottom:6px}
.rg.h{font-size:12px;color:var(--mut)}
.rg .pos{font-size:14px}.rg .pos.coml{font-weight:700;color:var(--acc)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}.chips button.on{background:var(--acc);color:var(--accink);border-color:var(--acc)}
.chk{display:flex;gap:8px;align-items:center;margin:4px 0}.chk input{width:auto}
.log .e{display:grid;grid-template-columns:200px 1fr auto;gap:8px;margin-bottom:8px}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);width:min(520px,94vw)}
dialog::backdrop{background:rgba(0,0,0,.45)}
.empty{text-align:center;padding:60px 20px;color:var(--mut)}
/* paper */
.page{background:#fff;color:#000;border:1px solid #bbb;padding:.45in;margin:0 auto 18px;max-width:8.5in;font:11pt/1.35 Arial,Helvetica,sans-serif}
.page *{color:#000}
.ph{border:2px solid #000;margin-bottom:10px}
.ph-t{padding:6px 10px;font-weight:700;font-size:14pt;border-bottom:1px solid #000;background:#e8e8e8}.ph-t .ics{margin-right:10px}
.exbanner{border:3px solid #000;background:#ffe066;-webkit-print-color-adjust:exact;print-color-adjust:exact;text-align:center;font-weight:700;font-size:12pt;letter-spacing:.04em;padding:4px 8px;margin:0 0 10px}
.page .exbanner:not(:first-child){margin:10px 0 0}
.ph-meta+.ph-meta{border-top:1px solid #000}.ph-meta{display:flex;gap:0}.ph-meta>div{padding:5px 10px;flex:1;font-size:10pt}.ph-meta>div+div{border-left:1px solid #000}
.pf{border:1px solid #000;padding:4px 8px;margin-bottom:6px}.pf>b{display:block;font-size:9pt;text-transform:uppercase}
.pf .v{white-space:pre-wrap;min-height:16px}
.pfg{display:grid;grid-template-columns:1fr 1fr;gap:0 8px}
table.pt{border-collapse:collapse;width:100%;margin-bottom:8px;font-size:9pt}
table.pt th,table.pt td{border:1px solid #000;padding:3px 5px;text-align:left;vertical-align:top}table.pt th{background:#e8e8e8}
.pcap{font-weight:700;font-size:10pt;margin:8px 0 3px}
.pfoot{font-size:8pt;margin-top:10px;border-top:1px solid #777;padding-top:4px}
.cover{text-align:center;padding-top:1.2in}.cover h1{font-size:30pt;margin:0 0 8px}.cover .big{font-size:20pt;font-weight:700}.cover ul{display:inline-block;text-align:left;margin-top:24px}
.oc{display:flex;flex-direction:column;gap:6px;flex:1;min-width:0}.orow{display:flex;gap:8px;margin-top:14px}
.ob{border:1.5px solid #000;padding:4px 6px;text-align:center;font-size:8.5pt}.ob b{display:block}.ob.chief{background:#e8e8e8}.ob.sub{margin-left:12px;border-style:dashed}
.ctop{display:flex;justify-content:center}.ctop .ob{width:200px}
.cstaff{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px}.cstaff .ob{width:150px}
#printRoot{display:none}
.sigbox{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:2px;padding:6px 8px;border:1px dashed var(--line);border-radius:6px;font-size:13px}
.sigbox img{height:44px;background:#fff;border-radius:4px;padding:2px;border:1px solid var(--line)}.sigbox select{width:auto;min-width:200px}
.sigbox .stale{color:var(--warn);font-weight:600}
#sc{width:100%;height:170px;background:#fff;border:1px solid var(--line);border-radius:8px;touch-action:none;cursor:crosshair;display:block}
.sglist{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:8px;margin-bottom:8px}.sglist img{height:46px;background:#fff;border-radius:4px;padding:2px}
.drop{display:block;border:2px dashed var(--line);border-radius:10px;padding:26px 14px;text-align:center;cursor:pointer;color:var(--mut)}.drop.over,.drop:hover{border-color:var(--acc);color:var(--ink)}
.cvprev{max-width:100%;max-height:340px;display:block;margin:12px auto;border-radius:6px;border:1px solid var(--line)}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}.lcard{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:6px}
.lcard img{width:100%;height:150px;object-fit:contain;background:#fff;border-radius:6px;border:1px solid var(--line)}
.attimg img{max-width:100%;max-height:7.4in;object-fit:contain;display:block;margin:6px auto}.attimg .acap{font-size:9pt;text-align:center}
.cimg{margin:0 0 18px}.cimg img{max-width:100%;max-height:4.4in;object-fit:contain;display:block;margin:0 auto}.cimg figcaption{font-size:9pt;margin-top:5px;text-align:center}
.cover.hasimg{padding-top:0}.cover.hasimg h1{font-size:26pt}
#tour{position:fixed;inset:0;z-index:1000}#tourShade{position:fixed;inset:0}
#tourSpot{position:fixed;border-radius:8px;box-shadow:0 0 0 9999px rgba(10,20,35,.62);outline:3px solid var(--acc);pointer-events:none;transition:left .2s,top .2s,width .2s,height .2s}
#tourCard{position:fixed;width:min(380px,calc(100vw - 16px));max-height:calc(100vh - 16px);overflow:auto;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:0 10px 40px rgba(0,0,0,.35);outline:none}
@media print{#tour{display:none!important}}
.sigimg{height:42px;display:block;margin-top:3px}.sigmeta{font-size:8pt}
.grid2>*{min-width:0}.row button{max-width:100%;white-space:normal;text-align:left}
@media screen{.page{overflow-x:auto}}
@media (max-width:600px){.page{padding:.18in}.top{gap:6px;position:static}}
@media (max-width:860px){#app{grid-template-columns:minmax(0,1fr)}#side{position:static;height:auto}.grid2{grid-template-columns:minmax(0,1fr)}.rg{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.rg.h{display:none}.log .e{grid-template-columns:1fr}#main{padding:0 12px 60px}}
@media print{
 body{background:#fff}#app{display:none!important}#printRoot{display:block}
 .page{border:0;margin:0;padding:0;max-width:none;page-break-after:always}.page:last-child{page-break-after:auto}
 @page{margin:.5in}
}
</style>
</head>
<body>
<div id="app"><aside id="side"></aside><main id="main"></main></div>
<div id="printRoot"></div>
<dialog id="dlg"><form method="dialog"><h3 id="dtt" style="margin-top:0"></h3><div id="dbody"></div><div class="row end"><button value="cancel" class="ghost">Cancel</button><button value="ok" class="pri">OK</button></div></form></dialog>
<dialog id="sigdlg"><div id="sigbody"></div></dialog>
<div id="tour" hidden><div id="tourShade"></div><div id="tourSpot"></div>
 <div id="tourCard" role="dialog" aria-modal="true" aria-labelledby="tourTitle" tabindex="-1"><div id="tourStep" class="mut" style="font-size:12px"></div><h3 id="tourTitle" style="margin:2px 0 8px"></h3><div id="tourBody" style="font-size:14px"></div>
  <div class="row" style="margin-top:14px;align-items:center"><button data-tour="skip" class="ghost">Skip tour</button><span style="flex:1"></span><button data-tour="back" id="tourBack">Back</button><button data-tour="next" id="tourNext" class="pri">Next</button></div></div></div>
<input type="file" id="imp" accept=".json" hidden>

<script>
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const pad=n=>String(n).padStart(2,'0');
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const toLocal=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'T'+pad(d.getHours())+':'+pad(d.getMinutes());
const fmt=s=>{if(!s)return '';const d=new Date(s);return isNaN(d)?s:pad(d.getDate())+' '+MON[d.getMonth()]+' '+d.getFullYear()+' '+pad(d.getHours())+pad(d.getMinutes())};
const KEY='iap-builder-v1';

/* ---------- ICS command structure ---------- */
const ROSTER=[
 {g:'Command',rows:['Incident Commander(s)','Deputy Incident Commander','Safety Officer','Public Information Officer','Liaison Officer']},
 {g:'Planning Section',rows:['Chief','Deputy','Resources Unit Leader','Situation Unit Leader','Documentation Unit Leader','Demobilization Unit Leader','Technical Specialist(s)']},
 {g:'Logistics Section',rows:['Chief','Deputy','Support Branch Director','Supply Unit Leader','Facilities Unit Leader','Ground Support Unit Leader','Service Branch Director',
   'Communications Unit Leader (COML)','Incident Communications Technician (COMT)','Radio Operator (RADO)','Incident Communications Center Manager (INCM)','Auxiliary Communications Coordinator (AUXC)','Medical Unit Leader','Food Unit Leader']},
 {g:'Operations Section',rows:['Chief','Deputy','Staging Area Manager','Air Operations Branch Director']},
 {g:'Finance/Administration Section',rows:['Chief','Deputy','Time Unit Leader','Procurement Unit Leader','Compensation/Claims Unit Leader','Cost Unit Leader']}
];
const SECS=['Command','Agency/Org Rep',...ROSTER.slice(1).map(x=>x.g)];
const STATUS=['Filled','Not activated','Needed - unfilled'];
const rk=(g,pos)=>g+'|'+pos;
const COML=rk('Logistics Section','Communications Unit Leader (COML)');
/* who to ask for each form: [roster key, fallback text] */
const OWNER={
 f201:[rk('Command','Incident Commander(s)'),''],
 f202:[rk('Planning Section','Chief'),'Planning Section Chief prepares; Incident Commander approves. If unfilled, the IC owns it.'],
 f203:[rk('Planning Section','Resources Unit Leader'),'If unfilled, the Planning Section Chief (or IC) maintains the roster.'],
 f204:[rk('Operations Section','Chief'),'If no Operations Section Chief is filled, the IC directs tactical assignments.'],
 f205:[COML,'No COML: the Logistics Section Chief (or IC) owns the communications plan. Consider activating a COML.'],
 f205a:[COML,'No COML: the Logistics Section Chief (or IC) owns the communications list.'],
 f206:[rk('Logistics Section','Medical Unit Leader'),'No Medical Unit Leader: Logistics Section Chief / Safety Officer owns the medical plan.'],
 f207:[rk('Planning Section','Resources Unit Leader'),'Built automatically from ICS 203.'],
 f208:[rk('Command','Safety Officer'),'No Safety Officer: the IC owns the safety message.'],
 f213:[rk('Command','Incident Commander(s)'),''],
 f213rr:[rk('Logistics Section','Chief'),'No Logistics Section Chief: route resource requests through the IC.'],
 f215:[rk('Operations Section','Chief'),'No Operations Section Chief: the IC owns the operational planning worksheet.'],
 f217a:[COML,'No COML: the Logistics Section Chief (or IC) owns channel availability.'],
 f309:[COML,'No COML: the Logistics Section Chief (or IC) owns the communications log.']
};

/* ---------- form schema ---------- */
const T=(k,l,x)=>Object.assign({k,l,t:'text'},x||{});
const A=(k,l,x)=>Object.assign({k,l,t:'area'},x||{});
const C=(k,l,x)=>Object.assign({k,l,t:'text'},x||{});
const YN=['Yes','No'],YNN=['Y','N'];
const SCHEMA={
 f201:{n:'ICS 201',t:'Incident Briefing',scope:'inc',items:[
  A('sketch','Map / Sketch (describe, or note the attached map showing incident area, key features, resource locations)'),
  A('summary','Situation Summary and Health & Safety Briefing (hazards identified and protective measures)'),
  {k:'actions',l:'Current and Planned Actions',t:'table',min:4,cols:[C('t','Time',{t:'dt'}),C('a','Summarize current and planned actions')]},
  {k:'res',l:'Resource Summary',t:'table',min:4,cols:[C('r','Resource'),C('id','Resource identification'),C('ord','Date/time ordered',{t:'dt'}),C('eta','ETA'),C('arr','Arrived?',{t:'select',o:YN}),C('n','Notes')]},
  T('prepName','Prepared by - Name',{half:1}),T('prepPos','Position / Title',{half:1})]},
 f202:{n:'ICS 202',t:'Incident Objectives',items:[
  {k:'objectives',l:'Objective(s)',t:'list',min:3},
  A('emphasis','Operational Period Command Emphasis'),
  A('sitaware','General Situational Awareness'),
  {k:'ssp',l:'Site Safety Plan Required?',t:'yn'},
  T('sspLoc','Approved Site Safety Plan(s) Located at'),
  {k:'contents',l:'Incident Action Plan (the items checked are included in this plan)',t:'contents'},
  T('other','Other attachments'),
  T('prepName','Prepared by - Name',{half:1}),T('prepPos','Position / Title',{half:1}),
  T('apprName','Approved by Incident Commander - Name',{half:1}),T('apprDT','Approval date/time',{half:1,t:'dt'})]},
 f203:{n:'ICS 203',t:'Organization Assignment List',items:[
  {k:'r',l:'Incident Command Structure and Staffing',t:'roster'},
  {k:'extra',l:'Additional positions (agency reps, branches, divisions, groups, other)',t:'table',min:3,cols:[C('sec','Section',{t:'select',o:SECS}),C('pos','Position'),C('name','Name'),C('agency','Agency'),C('phone','Contact')]},
  T('prepName','Prepared by - Name (Resources Unit)',{half:1}),T('prepPos','Position / Title',{half:1})]},
 f204:{n:'ICS 204',t:'Assignment List',inst:1,items:[
  T('branch','Branch',{half:1}),T('div','Division / Group / Staging',{half:1}),
  T('opsChief','Operations Section Chief',{half:1}),T('branchDir','Branch Director',{half:1}),T('divSup','Division / Group Supervisor',{half:1}),T('divContact','Supervisor contact',{half:1}),
  {k:'res',l:'Resources Assigned',t:'table',min:4,cols:[C('id','Resource identifier'),C('leader','Leader'),C('n','# persons',{t:'num'}),C('contact','Contact (phone / radio)'),C('rem','Reporting info / notes / remarks')]},
  A('work','Work Assignments'),A('special','Special Instructions'),
  {k:'comms',l:'Communications (radio and/or phone contact numbers needed for this assignment)',t:'table',min:3,cols:[C('f','Name / Function'),C('c','Primary contact (cell / radio freq / system / channel)')]},
  T('emMed','Emergency communications - Medical',{half:1}),T('emEvac','Emergency communications - Evacuation',{half:1}),T('emOther','Emergency communications - Other',{half:1}),
  T('prepName','Prepared by',{half:1}),T('revPSC','Reviewed by PSC',{half:1}),T('revOSC','Reviewed by OSC',{half:1}),T('dt','Date/time',{t:'dt',half:1})]},
 f205:{n:'ICS 205',t:'Incident Radio Communications Plan',items:[
  {k:'ch',l:'Basic Radio Channel Use',t:'table',min:6,cols:[C('zone','Zone / Grp'),C('ch','Ch #'),C('fn','Function'),C('name','Channel name / talkgroup'),C('as','Assignment'),C('rxf','RX freq (N/W)'),C('rxt','RX tone/NAC'),C('txf','TX freq (N/W)'),C('txt','TX tone/NAC'),C('mode','Mode',{t:'select',o:['A','D','M']}),C('rem','Remarks')]},
  A('special','Special Instructions'),
  T('prepName','Prepared by (Communications Unit Leader) - Name',{half:1}),T('dt','Date/time',{t:'dt',half:1})]},
 f205a:{n:'ICS 205A',t:'Communications List',items:[
  {k:'list',l:'Basic Local Communications Information',t:'table',min:8,cols:[C('pos','Incident assigned position'),C('name','Name'),C('m','Method(s) of contact (phone, pager, cell, etc.)')]},
  T('prepName','Prepared by - Name',{half:1}),T('dt','Date/time',{t:'dt',half:1})]},
 f206:{n:'ICS 206',t:'Medical Plan',items:[
  {k:'aid',l:'Medical Aid Stations',t:'table',min:2,cols:[C('n','Name'),C('l','Location'),C('c','Contact number(s) / frequency'),C('p','Paramedics on site?',{t:'select',o:YNN})]},
  {k:'amb',l:'Transportation - Ambulance Services',t:'table',min:2,cols:[C('n','Name'),C('a','Address'),C('c','Contact number(s) / frequency'),C('lv','Level',{t:'select',o:['ALS','BLS']})]},
  {k:'iamb',l:'Incident Ambulances',t:'table',min:2,cols:[C('n','Name'),C('l','Location'),C('c','Contact number(s) / frequency'),C('lv','Level',{t:'select',o:['ALS','BLS']})]},
  {k:'hosp',l:'Hospitals',t:'table',min:3,cols:[C('n','Name'),C('a','Address'),C('c','Contact number(s) / frequency'),C('ta','Travel time air'),C('tg','Travel time ground'),C('tr','Trauma center (Y/N + level)'),C('bu','Burn center',{t:'select',o:YNN}),C('hp','Helipad',{t:'select',o:YNN})]},
  A('proc','Special Medical Emergency Procedures'),
  {k:'avi',l:'Aviation assets utilized for rescue? (if yes, coordinate with Air Operations)',t:'yn'},
  T('prepName','Prepared by (Medical Unit Leader)',{half:1}),T('apprName','Reviewed by (Safety Officer)',{half:1})]},
 f207:{n:'ICS 207',t:'Incident Organization Chart',auto:1,items:[]},
 f208:{n:'ICS 208',t:'Safety Message / Plan',items:[
  A('msg','Safety Message / Expanded Safety Message, Safety Plan, Site Safety Plan',{rows:8}),
  {k:'ssp',l:'Site Safety Plan Required?',t:'yn'},
  T('sspLoc','Approved Site Safety Plan(s) Located at'),
  T('prepName','Prepared by (Safety Officer) - Name',{half:1}),T('dt','Date/time',{t:'dt',half:1})]},
 f213:{n:'ICS 213',t:'General Message',inst:1,items:[
  T('toName','To (name)',{half:1}),T('toPos','To (position)',{half:1}),
  T('fromName','From (name)',{half:1}),T('fromPos','From (position)',{half:1}),
  T('subject','Subject',{half:1}),T('dt','Date/time',{t:'dt'}),
  A('msg','Message',{rows:6}),
  T('apprName','Approved by - Name',{half:1}),T('apprPos','Position / Title',{half:1}),
  A('reply','Reply',{rows:4}),
  T('replyName','Replied by - Name',{half:1}),T('replyPos','Position / Title',{half:1}),T('replyDT','Reply date/time',{t:'dt'})]},
 f213rr:{n:'ICS 213RR',t:'Resource Request Message',inst:1,items:[
  T('reqNo','Resource request number',{half:1}),T('dt','Date/time',{t:'dt'}),
  {k:'items',l:'Resources requested',t:'table',min:4,cols:[C('qty','Qty',{t:'num'}),C('kind','Kind'),C('type','Type'),C('desc','Detailed item description / special requirements'),C('pri','Priority',{t:'select',o:['Immediate','Urgent','Routine']})]},
  T('loc','Delivery / reporting location'),T('arr','Requested delivery / arrival date-time',{t:'dt'}),
  T('subs','Suitable substitutes and/or alternate delivery location'),
  T('reqName','Requested by - Name',{half:1}),T('reqPos','Position / Title',{half:1}),T('reqContact','Contact (phone / radio)',{half:1}),
  T('apprName','Section Chief review / approval',{half:1}),
  T('orderNo','Logistics order number',{half:1}),T('supplier','Supplier / POC / phone',{half:1}),
  A('lnotes','Logistics notes (ETA, supplier, comments)',{rows:3}),
