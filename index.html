<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IAP Builder</title>
<style>
:root{--bg:#f3f5f8;--panel:#fff;--ink:#1b2430;--mut:#667085;--line:#d5dce6;--acc:#1f4e8c;--accink:#fff;--ok:#1a7f4b;--warn:#b54708;--bad:#b42318;--inp:#fff;--soft:#eaf0f8}
@media (prefers-color-scheme:dark){:root{--bg:#0f141b;--panel:#18202b;--ink:#e6ebf2;--mut:#93a1b5;--line:#2b3646;--acc:#5b9bff;--accink:#0b1220;--ok:#4cc38a;--warn:#f0a050;--bad:#ff8a80;--inp:#111821;--soft:#1d2836}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,Segoe UI,Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{background:var(--inp);border:1px solid var(--line);border-radius:6px;padding:7px 9px;width:100%}
textarea{min-height:90px;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
button{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:7px 12px;cursor:pointer;min-height:36px}
button:hover{border-color:var(--acc)}
button.pri{background:var(--acc);color:var(--accink);border-color:var(--acc);font-weight:600}
button.danger{color:var(--bad)}
button.ghost{background:none}
#app{display:grid;grid-template-columns:300px 1fr;min-height:100vh}
#side{background:var(--panel);border-right:1px solid var(--line);padding:14px;position:sticky;top:0;height:100vh;overflow:auto}
#main{padding:0 22px 60px;min-width:0}
.brand{font-weight:700;font-size:18px;margin-bottom:12px}.brand small{display:block;font-weight:400;color:var(--mut);font-size:12px}
.blk{margin-bottom:14px}.lbl{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em;display:block;margin:10px 0 4px}
.row{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.row.end{justify-content:flex-end}
.nav{display:flex;width:100%;text-align:left;align-items:center;gap:8px;border:0;background:none;padding:7px 8px;border-radius:6px;min-height:34px}
.nav:hover{background:var(--soft)}.nav.on{background:var(--soft);font-weight:600;box-shadow:inset 3px 0 var(--acc)}
.nav span{color:var(--mut);font-size:12px;margin-left:auto;text-align:right}
.nav.sub{padding-left:34px;font-size:13px}
.dot{width:10px;height:10px;border-radius:50%;border:2px solid var(--mut);flex:none}
.dot.part{background:var(--ok);border-color:var(--ok)}.dot.auto{border-color:var(--acc);background:var(--acc)}
.top{position:sticky;top:0;background:var(--bg);padding:12px 0;z-index:5;display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:16px}
.top .grow{flex:1;min-width:200px}
.pill{padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600;background:var(--soft)}
.pill.ok{color:var(--ok)}.pill.warn{color:var(--warn)}
h2{margin:6px 0 2px;font-size:22px}.mut{color:var(--mut)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
.f{display:block;margin-bottom:12px}.f>span,.cap{display:block;font-size:13px;font-weight:600;margin-bottom:4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.tw{overflow-x:auto;margin-bottom:8px}
table.et{border-collapse:collapse;width:100%;min-width:560px}
table.et th{font-size:12px;text-align:left;color:var(--mut);padding:4px;white-space:nowrap}
table.et td{padding:3px}table.et td input,table.et td select{min-width:90px}
.ask{border:1px solid var(--line);border-left:4px solid var(--acc);background:var(--panel);border-radius:8px;padding:10px 14px;margin-bottom:16px}
.ask.bad{border-left-color:var(--warn)}.ask b.w{color:var(--warn)}
.alert{border:1px solid var(--warn);border-radius:8px;padding:10px 14px;margin-bottom:14px;background:var(--panel)}
.alert ul{margin:6px 0 0 18px;padding:0}
.rg{display:grid;grid-template-columns:minmax(150px,1.2fr) 130px 1.2fr 1fr 1fr;gap:6px;align-items:center;margin-bottom:6px}
.rg.h{font-size:12px;color:var(--mut)}
.rg .pos{font-size:14px}.rg .pos.coml{font-weight:700;color:var(--acc)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}.chips button.on{background:var(--acc);color:var(--accink);border-color:var(--acc)}
.chk{display:flex;gap:8px;align-items:center;margin:4px 0}.chk input{width:auto}
.log .e{display:grid;grid-template-columns:200px 1fr auto;gap:8px;margin-bottom:8px}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);width:min(520px,94vw)}
dialog::backdrop{background:rgba(0,0,0,.45)}
.empty{text-align:center;padding:60px 20px;color:var(--mut)}
/* paper */
.page{background:#fff;color:#000;border:1px solid #bbb;padding:.45in;margin:0 auto 18px;max-width:8.5in;font:11pt/1.35 Arial,Helvetica,sans-serif}
.page *{color:#000}
.ph{border:2px solid #000;margin-bottom:10px}
.ph-t{padding:6px 10px;font-weight:700;font-size:14pt;border-bottom:1px solid #000;background:#e8e8e8}.ph-t .ics{margin-right:10px}
.ph-meta+.ph-meta{border-top:1px solid #000}.ph-meta{display:flex;gap:0}.ph-meta>div{padding:5px 10px;flex:1;font-size:10pt}.ph-meta>div+div{border-left:1px solid #000}
.pf{border:1px solid #000;padding:4px 8px;margin-bottom:6px}.pf>b{display:block;font-size:9pt;text-transform:uppercase}
.pf .v{white-space:pre-wrap;min-height:16px}
.pfg{display:grid;grid-template-columns:1fr 1fr;gap:0 8px}
table.pt{border-collapse:collapse;width:100%;margin-bottom:8px;font-size:9pt}
table.pt th,table.pt td{border:1px solid #000;padding:3px 5px;text-align:left;vertical-align:top}table.pt th{background:#e8e8e8}
.pcap{font-weight:700;font-size:10pt;margin:8px 0 3px}
.pfoot{font-size:8pt;margin-top:10px;border-top:1px solid #777;padding-top:4px}
.cover{text-align:center;padding-top:1.2in}.cover h1{font-size:30pt;margin:0 0 8px}.cover .big{font-size:20pt;font-weight:700}.cover ul{display:inline-block;text-align:left;margin-top:24px}
.oc{display:flex;flex-direction:column;gap:6px;flex:1;min-width:0}.orow{display:flex;gap:8px;margin-top:14px}
.ob{border:1.5px solid #000;padding:4px 6px;text-align:center;font-size:8.5pt}.ob b{display:block}.ob.chief{background:#e8e8e8}.ob.sub{margin-left:12px;border-style:dashed}
.ctop{display:flex;justify-content:center}.ctop .ob{width:200px}
.cstaff{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px}.cstaff .ob{width:150px}
#printRoot{display:none}
.sigbox{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:2px;padding:6px 8px;border:1px dashed var(--line);border-radius:6px;font-size:13px}
.sigbox img{height:44px;background:#fff;border-radius:4px;padding:2px;border:1px solid var(--line)}.sigbox select{width:auto;min-width:200px}
.sigbox .stale{color:var(--warn);font-weight:600}
#sc{width:100%;height:170px;background:#fff;border:1px solid var(--line);border-radius:8px;touch-action:none;cursor:crosshair;display:block}
.sglist{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:8px;margin-bottom:8px}.sglist img{height:46px;background:#fff;border-radius:4px;padding:2px}
.drop{display:block;border:2px dashed var(--line);border-radius:10px;padding:26px 14px;text-align:center;cursor:pointer;color:var(--mut)}.drop.over,.drop:hover{border-color:var(--acc);color:var(--ink)}
.cvprev{max-width:100%;max-height:340px;display:block;margin:12px auto;border-radius:6px;border:1px solid var(--line)}
.cimg{margin:0 0 18px}.cimg img{max-width:100%;max-height:4.4in;object-fit:contain;display:block;margin:0 auto}.cimg figcaption{font-size:9pt;margin-top:5px;text-align:center}
.cover.hasimg{padding-top:0}.cover.hasimg h1{font-size:26pt}
.sigimg{height:42px;display:block;margin-top:3px}.sigmeta{font-size:8pt}
@media (max-width:860px){#app{grid-template-columns:1fr}#side{position:static;height:auto}.grid2{grid-template-columns:1fr}.rg{grid-template-columns:1fr 1fr}.rg.h{display:none}.log .e{grid-template-columns:1fr}#main{padding:0 12px 60px}}
@media print{
 body{background:#fff}#app{display:none!important}#printRoot{display:block}
 .page{border:0;margin:0;padding:0;max-width:none;page-break-after:always}.page:last-child{page-break-after:auto}
 @page{margin:.5in}
}
</style>
</head>
<body>
<div id="app"><aside id="side"></aside><main id="main"></main></div>
<div id="printRoot"></div>
<dialog id="dlg"><form method="dialog"><h3 id="dtt" style="margin-top:0"></h3><div id="dbody"></div><div class="row end"><button value="cancel" class="ghost">Cancel</button><button value="ok" class="pri">OK</button></div></form></dialog>
<dialog id="sigdlg"><div id="sigbody"></div></dialog>
<input type="file" id="imp" accept=".json" hidden>

<script>
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const pad=n=>String(n).padStart(2,'0');
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const toLocal=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'T'+pad(d.getHours())+':'+pad(d.getMinutes());
const fmt=s=>{if(!s)return '';const d=new Date(s);return isNaN(d)?s:pad(d.getDate())+' '+MON[d.getMonth()]+' '+d.getFullYear()+' '+pad(d.getHours())+pad(d.getMinutes())};
const KEY='iap-builder-v1';

/* ---------- ICS command structure ---------- */
const ROSTER=[
 {g:'Command',rows:['Incident Commander(s)','Deputy Incident Commander','Safety Officer','Public Information Officer','Liaison Officer']},
 {g:'Planning Section',rows:['Chief','Deputy','Resources Unit Leader','Situation Unit Leader','Documentation Unit Leader','Demobilization Unit Leader','Technical Specialist(s)']},
 {g:'Logistics Section',rows:['Chief','Deputy','Support Branch Director','Supply Unit Leader','Facilities Unit Leader','Ground Support Unit Leader','Service Branch Director',
   'Communications Unit Leader (COML)','Incident Communications Technician (COMT)','Radio Operator (RADO)','Incident Communications Center Manager (INCM)','Auxiliary Communications Coordinator (AUXC)','Medical Unit Leader','Food Unit Leader']},
 {g:'Operations Section',rows:['Chief','Deputy','Staging Area Manager','Air Operations Branch Director']},
 {g:'Finance/Administration Section',rows:['Chief','Deputy','Time Unit Leader','Procurement Unit Leader','Compensation/Claims Unit Leader','Cost Unit Leader']}
];
const SECS=['Command','Agency/Org Rep',...ROSTER.slice(1).map(x=>x.g)];
const STATUS=['Filled','Not activated','Needed - unfilled'];
const rk=(g,pos)=>g+'|'+pos;
const COML=rk('Logistics Section','Communications Unit Leader (COML)');
/* who to ask for each form: [roster key, fallback text] */
const OWNER={
 f201:[rk('Command','Incident Commander(s)'),''],
 f202:[rk('Planning Section','Chief'),'Planning Section Chief prepares; Incident Commander approves. If unfilled, the IC owns it.'],
 f203:[rk('Planning Section','Resources Unit Leader'),'If unfilled, the Planning Section Chief (or IC) maintains the roster.'],
 f204:[rk('Operations Section','Chief'),'If no Operations Section Chief is filled, the IC directs tactical assignments.'],
 f205:[COML,'No COML: the Logistics Section Chief (or IC) owns the communications plan. Consider activating a COML.'],
 f205a:[COML,'No COML: the Logistics Section Chief (or IC) owns the communications list.'],
 f206:[rk('Logistics Section','Medical Unit Leader'),'No Medical Unit Leader: Logistics Section Chief / Safety Officer owns the medical plan.'],
 f207:[rk('Planning Section','Resources Unit Leader'),'Built automatically from ICS 203.'],
 f208:[rk('Command','Safety Officer'),'No Safety Officer: the IC owns the safety message.'],
 f213:[rk('Command','Incident Commander(s)'),''],
 f213rr:[rk('Logistics Section','Chief'),'No Logistics Section Chief: route resource requests through the IC.'],
 f215:[rk('Operations Section','Chief'),'No Operations Section Chief: the IC owns the operational planning worksheet.'],
 f217a:[COML,'No COML: the Logistics Section Chief (or IC) owns channel availability.'],
 f309:[COML,'No COML: the Logistics Section Chief (or IC) owns the communications log.']
};

/* ---------- form schema ---------- */
const T=(k,l,x)=>Object.assign({k,l,t:'text'},x||{});
const A=(k,l,x)=>Object.assign({k,l,t:'area'},x||{});
const C=(k,l,x)=>Object.assign({k,l,t:'text'},x||{});
const YN=['Yes','No'],YNN=['Y','N'];
const SCHEMA={
 f201:{n:'ICS 201',t:'Incident Briefing',scope:'inc',items:[
  A('sketch','Map / Sketch (describe, or note the attached map showing incident area, key features, resource locations)'),
  A('summary','Situation Summary and Health & Safety Briefing (hazards identified and protective measures)'),
  {k:'actions',l:'Current and Planned Actions',t:'table',min:4,cols:[C('t','Time',{t:'dt'}),C('a','Summarize current and planned actions')]},
  {k:'res',l:'Resource Summary',t:'table',min:4,cols:[C('r','Resource'),C('id','Resource identification'),C('ord','Date/time ordered',{t:'dt'}),C('eta','ETA'),C('arr','Arrived?',{t:'select',o:YN}),C('n','Notes')]},
  T('prepName','Prepared by - Name',{half:1}),T('prepPos','Position / Title',{half:1})]},
 f202:{n:'ICS 202',t:'Incident Objectives',items:[
  {k:'objectives',l:'Objective(s)',t:'list',min:3},
  A('emphasis','Operational Period Command Emphasis'),
  A('sitaware','General Situational Awareness'),
  {k:'ssp',l:'Site Safety Plan Required?',t:'yn'},
  T('sspLoc','Approved Site Safety Plan(s) Located at'),
  {k:'contents',l:'Incident Action Plan (the items checked are included in this plan)',t:'contents'},
  T('other','Other attachments'),
  T('prepName','Prepared by - Name',{half:1}),T('prepPos','Position / Title',{half:1}),
  T('apprName','Approved by Incident Commander - Name',{half:1}),T('apprDT','Approval date/time',{half:1,t:'dt'})]},
 f203:{n:'ICS 203',t:'Organization Assignment List',items:[
  {k:'r',l:'Incident Command Structure and Staffing',t:'roster'},
  {k:'extra',l:'Additional positions (agency reps, branches, divisions, groups, other)',t:'table',min:3,cols:[C('sec','Section',{t:'select',o:SECS}),C('pos','Position'),C('name','Name'),C('agency','Agency'),C('phone','Contact')]},
  T('prepName','Prepared by - Name (Resources Unit)',{half:1}),T('prepPos','Position / Title',{half:1})]},
 f204:{n:'ICS 204',t:'Assignment List',inst:1,items:[
  T('branch','Branch',{half:1}),T('div','Division / Group / Staging',{half:1}),
  T('opsChief','Operations Section Chief',{half:1}),T('branchDir','Branch Director',{half:1}),T('divSup','Division / Group Supervisor',{half:1}),T('divContact','Supervisor contact',{half:1}),
  {k:'res',l:'Resources Assigned',t:'table',min:4,cols:[C('id','Resource identifier'),C('leader','Leader'),C('n','# persons',{t:'num'}),C('contact','Contact (phone / radio)'),C('rem','Reporting info / notes / remarks')]},
  A('work','Work Assignments'),A('special','Special Instructions'),
  {k:'comms',l:'Communications (radio and/or phone contact numbers needed for this assignment)',t:'table',min:3,cols:[C('f','Name / Function'),C('c','Primary contact (cell / radio freq / system / channel)')]},
  T('emMed','Emergency communications - Medical',{half:1}),T('emEvac','Emergency communications - Evacuation',{half:1}),T('emOther','Emergency communications - Other',{half:1}),
  T('prepName','Prepared by',{half:1}),T('revPSC','Reviewed by PSC',{half:1}),T('revOSC','Reviewed by OSC',{half:1}),T('dt','Date/time',{t:'dt',half:1})]},
 f205:{n:'ICS 205',t:'Incident Radio Communications Plan',items:[
  {k:'ch',l:'Basic Radio Channel Use',t:'table',min:6,cols:[C('zone','Zone / Grp'),C('ch','Ch #'),C('fn','Function'),C('name','Channel name / talkgroup'),C('as','Assignment'),C('rxf','RX freq (N/W)'),C('rxt','RX tone/NAC'),C('txf','TX freq (N/W)'),C('txt','TX tone/NAC'),C('mode','Mode',{t:'select',o:['A','D','M']}),C('rem','Remarks')]},
  A('special','Special Instructions'),
  T('prepName','Prepared by (Communications Unit Leader) - Name',{half:1}),T('dt','Date/time',{t:'dt',half:1})]},
 f205a:{n:'ICS 205A',t:'Communications List',items:[
  {k:'list',l:'Basic Local Communications Information',t:'table',min:8,cols:[C('pos','Incident assigned position'),C('name','Name'),C('m','Method(s) of contact (phone, pager, cell, etc.)')]},
  T('prepName','Prepared by - Name',{half:1}),T('dt','Date/time',{t:'dt',half:1})]},
 f206:{n:'ICS 206',t:'Medical Plan',items:[
  {k:'aid',l:'Medical Aid Stations',t:'table',min:2,cols:[C('n','Name'),C('l','Location'),C('c','Contact number(s) / frequency'),C('p','Paramedics on site?',{t:'select',o:YNN})]},
  {k:'amb',l:'Transportation - Ambulance Services',t:'table',min:2,cols:[C('n','Name'),C('a','Address'),C('c','Contact number(s) / frequency'),C('lv','Level',{t:'select',o:['ALS','BLS']})]},
  {k:'iamb',l:'Incident Ambulances',t:'table',min:2,cols:[C('n','Name'),C('l','Location'),C('c','Contact number(s) / frequency'),C('lv','Level',{t:'select',o:['ALS','BLS']})]},
  {k:'hosp',l:'Hospitals',t:'table',min:3,cols:[C('n','Name'),C('a','Address'),C('c','Contact number(s) / frequency'),C('ta','Travel time air'),C('tg','Travel time ground'),C('tr','Trauma center (Y/N + level)'),C('bu','Burn center',{t:'select',o:YNN}),C('hp','Helipad',{t:'select',o:YNN})]},
  A('proc','Special Medical Emergency Procedures'),
  {k:'avi',l:'Aviation assets utilized for rescue? (if yes, coordinate with Air Operations)',t:'yn'},
  T('prepName','Prepared by (Medical Unit Leader)',{half:1}),T('apprName','Reviewed by (Safety Officer)',{half:1})]},
 f207:{n:'ICS 207',t:'Incident Organization Chart',auto:1,items:[]},
 f208:{n:'ICS 208',t:'Safety Message / Plan',items:[
  A('msg','Safety Message / Expanded Safety Message, Safety Plan, Site Safety Plan',{rows:8}),
  {k:'ssp',l:'Site Safety Plan Required?',t:'yn'},
  T('sspLoc','Approved Site Safety Plan(s) Located at'),
  T('prepName','Prepared by (Safety Officer) - Name',{half:1}),T('dt','Date/time',{t:'dt',half:1})]},
 f213:{n:'ICS 213',t:'General Message',inst:1,items:[
  T('toName','To (name)',{half:1}),T('toPos','To (position)',{half:1}),
  T('fromName','From (name)',{half:1}),T('fromPos','From (position)',{half:1}),
  T('subject','Subject',{half:1}),T('dt','Date/time',{t:'dt'}),
  A('msg','Message',{rows:6}),
  T('apprName','Approved by - Name',{half:1}),T('apprPos','Position / Title',{half:1}),
  A('reply','Reply',{rows:4}),
  T('replyName','Replied by - Name',{half:1}),T('replyPos','Position / Title',{half:1}),T('replyDT','Reply date/time',{t:'dt'})]},
 f213rr:{n:'ICS 213RR',t:'Resource Request Message',inst:1,items:[
  T('reqNo','Resource request number',{half:1}),T('dt','Date/time',{t:'dt'}),
  {k:'items',l:'Resources requested',t:'table',min:4,cols:[C('qty','Qty',{t:'num'}),C('kind','Kind'),C('type','Type'),C('desc','Detailed item description / special requirements'),C('pri','Priority',{t:'select',o:['Immediate','Urgent','Routine']})]},
  T('loc','Delivery / reporting location'),T('arr','Requested delivery / arrival date-time',{t:'dt'}),
  T('subs','Suitable substitutes and/or alternate delivery location'),
  T('reqName','Requested by - Name',{half:1}),T('reqPos','Position / Title',{half:1}),T('reqContact','Contact (phone / radio)',{half:1}),
  T('apprName','Section Chief review / approval',{half:1}),
  T('orderNo','Logistics order number',{half:1}),T('supplier','Supplier / POC / phone',{half:1}),
  A('lnotes','Logistics notes (ETA, supplier, comments)',{rows:3}),
  A('fnotes','Finance / Admin comments',{rows:2})]},
 f215:{n:'ICS 215',t:'Operational Planning Worksheet',inst:1,items:[
  T('title','Worksheet name (e.g. "Day shift - Division A-C")'),
  {k:'rows',l:'Work assignments and resource needs (one row per division/group per resource type)',t:'table',min:5,sum:['req','have','need'],cols:[C('div','Division / Group / Other'),C('work','Work assignment & special instructions'),C('rtype','Resource kind / type'),C('req','Req',{t:'num'}),C('have','Have',{t:'num'}),C('need','Need',{t:'num'}),C('loc','Reporting location'),C('arr','Requested arrival',{t:'dt'})]},
  T('prepName','Prepared by - Name',{half:1}),T('prepPos','Position / Title',{half:1})]},
 f217a:{n:'ICS 217A',t:'Communications Resource Availability Worksheet',inst:1,items:[
  T('title','Worksheet name (e.g. "Interoperability channels", "AUXCOMM amateur")'),
  {k:'tpl',l:'Channel templates (adds rows - NIFOG rows verified against CISA NIFOG 2.02; AUXCOMM rows are local - fill in)',t:'tpl'},
  {k:'ch',l:'Available channels',t:'table',min:4,cols:[C('sys','System / zone'),C('ch','Ch #'),C('fn','Function'),C('name','Channel name / talkgroup'),C('rxf','RX freq (N/W)'),C('rxt','RX tone/NAC'),C('txf','TX freq (N/W)'),C('txt','TX tone/NAC'),C('mode','Mode',{t:'select',o:['A','D','M']}),C('rem','Remarks')]},
  T('prepName','Prepared by - Name',{half:1}),T('dt','Date/time',{t:'dt',half:1})]},
 f309:{n:'ICS 309',t:'Communications Log',inst:1,items:[
  T('op','Radio operator - Name',{half:1}),T('opPos','Position / station ID',{half:1}),
  {k:'log',l:'Communications log',t:'table',min:8,now:1,cols:[C('t','Time',{t:'dt'}),C('to','To (name / ID)'),C('from','From (name / ID)'),C('msg','Message')]},
  T('prepName','Prepared by - Name',{half:1}),T('dt','Date/time',{t:'dt',half:1})]}
};
const IAP_ORDER=['f202','f203','f204','f205','f205a','f206','f207','f208'];
const EXTRA=['f215','f217a','f213','f213rr','f309'];
const INST=['f204',...EXTRA];
const INC_DEFAULT={map:false,wx:false,f213:false,f213rr:false,f309:false};
const arr=(p,k)=>p.d[k]||(p.d[k]=[]);
/* ---------- e-signatures ---------- */
const SIGKEYS=['prepName','apprName','revPSC','revOSC','replyName','reqName','op'];

 if(ui.preview){
  const c=checks(inc,p);
  h+=`<div style="display:flex;gap:10px;align-items:center;margin-bottom:12px"><h2 style="flex:1">IAP Preview</h2><button class="pri" data-act="printIAP">Print / Save as PDF</button></div>`;
  h+=c.length?`<div class="alert"><b>${c.length} open item${c.length>1?'s':''} before this IAP is ready:</b><ul>${c.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`:`<div class="alert" style="border-color:var(--ok)"><b>All core checks pass.</b></div>`;
  h+=iapHTML(inc,p)}
 else if(ui.form==='cover'){
  const cv=inc.cover=inc.cover||{},img=coverImg(inc);
  h+=`<div style="display:flex;gap:10px;align-items:center"><div style="flex:1"><h2>Cover page</h2><span class="mut">Image shown at the top of the front page of every IAP for this incident</span></div><button data-act="preview">Preview IAP</button></div>
  <div class="card"><label class="drop" id="drop" for="coverFile"><b>${img?'Replace image':'Add an image'}</b><br>Click to choose a picture, drag one here, or paste from the clipboard (Ctrl+V).<br><span style="font-size:12px">Photos and AI-generated images both work (JPG, PNG, WebP). Large images are resized to keep the plan lightweight.</span></label><input type="file" id="coverFile" accept="image/*" hidden>
  ${img?`<img class="cvprev" src="${esc(img)}" alt="Cover image preview"><div class="mut" style="text-align:center;font-size:12px">${esc(cv.name||'')}${cv.size?' &middot; '+cv.size:''}</div>`:''}
  <div class="grid2" style="margin-top:14px"><label class="f"><span>Caption (optional)</span><input data-p='["caption"]' value="${esc(cv.caption)}" placeholder="e.g. Flooding on Main Street, 05 Oct 2026"></label><label class="f"><span>Photo credit / source (optional)</span><input data-p='["credit"]' value="${esc(cv.credit)}" placeholder="e.g. Pope County EM"></label></div>
  <label class="chk"><input type="checkbox" id="coverAI" ${cv.ai?'checked':''}>This image is AI-generated (prints an &quot;AI-generated image&quot; label)</label>
  ${img?'<div class="row"><button class="danger" data-act="coverRemove">Remove image</button></div>':''}</div>`}
 else if(ui.form==='f214'){
  inc.logger=inc.logger||{};inc.log=inc.log||[];
  h+=`<div style="display:flex;gap:10px;align-items:center"><div style="flex:1"><h2>ICS 214 Activity Log</h2><span class="mut">Ongoing, timestamped record of notable activities</span></div><button data-act="printLog">Print log</button></div>
  <div class="card"><div class="grid2"><label class="f"><span>Name</span><input data-p='["logger","name"]' value="${esc(inc.logger.name)}"></label><label class="f"><span>ICS position</span><input data-p='["logger","pos"]' value="${esc(inc.logger.pos)}"></label></div>
  <label class="f"><span>New entry</span><textarea id="logNew" placeholder="What happened? (Ctrl+Enter to add)"></textarea></label><div class="row" style="align-items:center"><input type="datetime-local" id="logT" style="width:230px" value="${toLocal(new Date())}"><button class="pri" data-act="addLog">Add to log</button></div></div>
  <div class="log">${[...inc.log].map((e,i)=>({e,i})).reverse().map(({e,i})=>`<div class="e card" style="padding:10px"><input type="datetime-local" data-p='["log",${i},"t"]' value="${esc(e.t)}"><textarea rows="2" style="min-height:44px" data-p='["log",${i},"text"]'>${esc(e.text)}</textarea><button class="danger" data-act="delLog" data-i="${i}">&times;</button></div>`).join('')||'<p class="mut">No entries yet.</p>'}</div>`}
 else{
  const f=ui.form,s=SCHEMA[f];
  h+=`<div style="display:flex;gap:10px;align-items:center"><div style="flex:1"><h2>${s.n} &mdash; ${s.t}</h2></div><button data-act="printForm">Print this form</button></div>`;
  if(s.scope!=='inc')h+=ownerBanner(f,p);
  {const m=inc.prep&&inc.prep[f],oo=curObj();
   if(m&&oo&&remOn()&&!locked&&PREP_KEYS.some(k=>m[k]&&!oo[k]&&s.items.some(i=>i.k===k)))h+=`<div class="ask"><b>Last preparer for ${s.n}:</b> ${esc([m.prepName||m.op||m.reqName||m.fromName,m.prepPos||m.opPos||m.reqPos||m.fromPos].filter(Boolean).join(', '))} <button data-act="usePrep" style="margin-left:8px">Use for this form</button></div>`}
  if(f==='f207'){h+=`<div class="card"><p class="mut">Generated automatically from the ICS 203 staffing roster.</p><div style="background:#fff;padding:12px;border-radius:8px">${`<div class="page" style="border:0;padding:0;max-width:none">`+orgChart(p)+`</div>`}</div></div>`}
  else{
   if(INST.includes(f)){
    const l=arr(p,f);
    if(!l.length)h+=`<div class="empty">No ${s.n} forms yet.<br><br><button class="pri" data-act="addInst" data-f="${f}">+ Add ${s.n}</button></div>`;
    else{h+=`<div class="chips">${l.map((x,i)=>`<button class="${ui.inst===x.id?'on':''}" data-act="go" data-f="${f}" data-inst="${x.id}">${esc(instLabel(f,x,i))}</button>`).join('')}<button data-act="addInst" data-f="${f}">+ Add</button><button data-act="dupInst">Duplicate</button><button class="danger" data-act="delInst">Delete this</button></div>`;
     if(f!=='f204')h+=`<label class="chk" style="margin-bottom:12px"><input type="checkbox" data-inc="${f}" ${isInc(p,f)?'checked':''}>Include ${s.n} forms in the printed IAP</label>`}
   }
   const o=curObj();
   if(o){ensure(s.items,o);h+=`<fieldset style="border:0;padding:0;margin:0" ${locked&&s.scope!=='inc'?'disabled':''}><div class="card"><div class="grid2">${s.items.map(it=>ed(it,o,p)).join('')}</div></div></fieldset>`}
  }
 }
 m.innerHTML=h;scrollTo(0,y);const sv=$('#saved');if(sv)sv.textContent=''}
function render(){renderSide();renderMain()}

/* ---------- dialog ---------- */
function ask(title,fields,ok){
 const d=$('#dlg');$('#dtt').textContent=title;
 $('#dbody').innerHTML=fields.map(f=>`<label class="f"><span>${f.l}</span>${f.t==='select'?`<select name="${f.k}">${f.o.map(([v,l])=>`<option value="${v}">${esc(l)}</option>`).join('')}</select>`:`<input name="${f.k}" type="${f.t||'text'}" value="${esc(f.v||'')}">`}</label>`).join('');
 d.onclose=()=>{if(d.returnValue==='ok'){const o={};fields.forEach(f=>o[f.k]=d.querySelector(`[name=${f.k}]`).value);ok(o)}d.returnValue=''};
 d.showModal()}
const hourNow=()=>{const d=new Date();d.setMinutes(0,0,0);return d};

/* ---------- actions ---------- */
function doPrint(html,title){const old=document.title;$('#printRoot').innerHTML=html;document.title=title||old;
 const back=()=>{document.title=old;removeEventListener('afterprint',back)};addEventListener('afterprint',back);setTimeout(()=>print(),50)}
const ACT={
 newInc(){const a=hourNow(),b=new Date(a.getTime()+12*36e5);
  ask('New incident',[{k:'name',l:'Incident name'},{k:'number',l:'Incident number (optional)'},{k:'type',l:'Incident type'},{k:'location',l:'Location'},{k:'jurisdiction',l:'Jurisdiction / agency'},{k:'declaration',l:'Declaration / disaster # (optional)'},{k:'started',l:'Incident began (date/time)',t:'datetime-local',v:toLocal(new Date())},{k:'from',l:'Operational period 1 - from',t:'datetime-local',v:toLocal(a)},{k:'to',l:'to',t:'datetime-local',v:toLocal(b)}],o=>{
   const inc={id:uid(),name:o.name.trim()||'Unnamed incident',number:o.number,type:o.type,location:o.location,jurisdiction:o.jurisdiction,declaration:o.declaration,started:o.started,brief:{},log:[],logger:{},periods:[newPeriod(o.from,o.to)],pi:0};
   S.incidents.push(inc);S.cur=inc.id;ui={form:'f203',inst:null,preview:false};save();render()})},
 editInc(){const i=curInc();ask('Edit incident (prints on every form)',[{k:'name',l:'Incident name',v:i.name},{k:'number',l:'Incident number',v:i.number},{k:'type',l:'Incident type',v:i.type},{k:'location',l:'Location',v:i.location},{k:'jurisdiction',l:'Jurisdiction / agency',v:i.jurisdiction},{k:'declaration',l:'Declaration / disaster #',v:i.declaration},{k:'started',l:'Incident began (date/time)',t:'datetime-local',v:i.started}],o=>{i.name=o.name.trim()||i.name;['number','type','location','jurisdiction','declaration','started'].forEach(k=>i[k]=o[k]);save();render()})},
 delInc(){const i=curInc();if(confirm(`Delete "${i.name}" and ALL its periods and logs? This cannot be undone. Export a backup first if unsure.`)){if(i.cover&&i.cover.imgId&&S.images)delete S.images[i.cover.imgId];S.incidents=S.incidents.filter(x=>x!==i);S.cur=S.incidents[0]&&S.incidents[0].id;save();render()}},
 newPer(){const inc=curInc(),pv=curP();const dur=new Date(pv.to)-new Date(pv.from)||12*36e5;const to=new Date(new Date(pv.to).getTime()+dur);
  ask('Start next operational period',[{k:'from',l:'From',t:'datetime-local',v:pv.to},{k:'to',l:'To',t:'datetime-local',v:toLocal(to)},{k:'copy',l:'Starting content',t:'select',o:[['copy','Copy forward from previous period (recommended)'],['blank','Start blank']]}],o=>{
   const np=newPeriod(o.from,o.to);
   if(o.copy==='copy'){np.d=JSON.parse(JSON.stringify(pv.d));INST.forEach(k=>{if(np.d[k])np.d[k].forEach(x=>x.id=uid())});['f213','f213rr','f309'].forEach(k=>np.d[k]=[]);np.d.f202.apprName='';np.d.f202.apprDT='';np.include=Object.assign({},pv.include)}
   ['f202','f203','f205','f205a','f206','f208'].forEach(k=>{np.d[k]=np.d[k]||{};fillPrep(inc,k,np.d[k])});
   inc.periods.push(np);inc.pi=inc.periods.length-1;ui.preview=false;save();render()})},
 editPer(){const p=curP();ask('Operational period times',[{k:'from',l:'From',t:'datetime-local',v:p.from},{k:'to',l:'To',t:'datetime-local',v:p.to}],o=>{p.from=o.from;p.to=o.to;save();render()})},
 approve(){const p=curP();if(p.status==='approved'){if(confirm('Unlock this approved period for editing?')){p.status='draft';delete p.approvedAt}}else{p.status='approved';p.approvedAt=toLocal(new Date());if(!p.d.f202.apprDT)p.d.f202.apprDT=p.approvedAt}save();render()},
 go(el){ui.form=el.dataset.f;ui.preview=false;if(el.dataset.inst)ui.inst=el.dataset.inst;else if(INST.includes(ui.form)&&!arr(curP(),ui.form).find(x=>x.id===ui.inst))ui.inst=(arr(curP(),ui.form)[0]||{}).id;scrollTo(0,0);render()},
 preview(){ui.preview=true;scrollTo(0,0);render()},
 addInst(el){const p=curP(),f=el.dataset.f,x={id:uid()};if(SCHEMA[f].items.some(i=>i.k==='dt'&&i.t==='dt'))x.dt=toLocal(new Date());fillPrep(curInc(),f,x);arr(p,f).push(x);ui.form=f;ui.inst=x.id;ui.preview=false;save();render();scrollTo(0,0)},
 dupInst(){const p=curP(),l=arr(p,ui.form),s=l.find(x=>x.id===ui.inst);if(!s)return;const x=JSON.parse(JSON.stringify(s));x.id=uid();const lk={f204:'div',f215:'title',f217a:'title',f213:'subject',f309:'op'}[ui.form];if(lk)x[lk]=(x[lk]||'')+' (copy)';l.push(x);ui.inst=x.id;save();render()},
 delInst(){const p=curP();if(confirm('Delete this '+SCHEMA[ui.form].n+' form?')){p.d[ui.form]=arr(p,ui.form).filter(x=>x.id!==ui.inst);ui.inst=(p.d[ui.form][0]||{}).id;save();render()}},
 tpl(el){const o=curObj(),t=TPL[el.dataset.tpl],ks=['sys','ch','fn','name','rxf','rxt','txf','txt','mode','rem'];
  o.ch=(o.ch||[]).filter(hasData);t.rows.forEach(r=>{const x={};ks.forEach((k,i)=>x[k]=r[i]);o.ch.push(x)});save();render()},
 push205(){const o=curObj(),p=curP(),rows=(o.ch||[]).filter(hasData);if(!rows.length){alert('No channels to copy yet.');return}
  if(!confirm(`Copy ${rows.length} channel(s) into ICS 205 for this operational period? Existing ICS 205 rows are kept.`))return;
  const f=p.d.f205;f.ch=(f.ch||[]).filter(hasData);rows.forEach(r=>f.ch.push({zone:r.sys,ch:r.ch,fn:r.fn,name:r.name,as:'',rxf:r.rxf,rxt:r.rxt,txf:r.txf,txt:r.txt,mode:r.mode,rem:r.rem}));save();render();alert('Copied. Fill in the Assignment column in ICS 205.')},
 coverRemove(){const inc=curInc();if(confirm('Remove the cover image?')){if(inc.cover&&inc.cover.imgId&&S.images)delete S.images[inc.cover.imgId];inc.cover={caption:inc.cover&&inc.cover.caption,credit:inc.cover&&inc.cover.credit};save();render()}},
 sigMgr(){sigShow(sigMgrHTML())},
 sigClose(){$('#sigdlg').close()},
 sigNew(){sg={mode:'draw',drawn:false,name:'',pos:'',typed:''};sigShow(sigNewHTML());sigCanvas()},
 sigMode(el){sg.name=$('#sgName').value;sg.pos=$('#sgPos').value;sg.mode=el.dataset.m;sg.drawn=false;sg.typed='';sigShow(sigNewHTML());sigCanvas()},
 sigClear(){const c=$('#sc');c.getContext('2d').clearRect(0,0,c.width,c.height);if(sg.mode==='type'){$('#sgType').value=''}sg.drawn=false;sigChk()},
 async sigSave(){const c=$('#sc'),img=trimCanvas(c);if(!img){alert('Draw or type a signature first.');return}
  const pin=$('#sgPin').value.trim(),g={id:uid(),name:$('#sgName').value.trim(),pos:$('#sgPos').value.trim(),img,at:toLocal(new Date()),pin:null};
  if(pin){const salt=uid();g.pin={salt,hash:await pinHash(pin,salt)}}
  S.sigs=S.sigs||[];S.sigs.push(g);save();sigShow(sigMgrHTML());render()},
 sigDel(el){const g=(S.sigs||[]).find(x=>x.id===el.dataset.id);if(g&&confirm(`Delete the saved signature for ${g.name}? Forms already signed keep their copy.`)){S.sigs=S.sigs.filter(x=>x!==g);save();sigShow(sigMgrHTML());render()}},
 async sign(el){const key=el.dataset.k,o=curObj(),sel=el.parentElement.querySelector('select'),g=(S.sigs||[]).find(x=>x.id===sel.value);if(!g||!o)return;
  const it=SCHEMA[ui.form].items.find(i=>i.k===key);
  if(g.pin){const pin=prompt(`Enter the PIN for ${g.name}'s signature`);if(pin===null)return;if(await pinHash(pin.trim(),g.pin.salt)!==g.pin.hash){alert('Incorrect PIN.');return}}
  if(!confirm(`Apply the electronic signature of ${g.name}${g.pos?' ('+g.pos+')':''} to "${it.l}" on ${SCHEMA[ui.form].n}?\n\nThis records the date and time of signing.`))return;
  if(!o[key])o[key]=g.name;
  o[key+'_sig']={img:g.img,name:g.name,pos:g.pos,at:toLocal(new Date()),hash:fh(o)};save();render()},
 unsign(el){const o=curObj();if(o&&confirm('Remove this signature from the form?')){delete o[el.dataset.k+'_sig'];save();render()}},
 usePrep(){const o=curObj(),m=(curInc().prep||{})[ui.form];if(!o||!m)return;PREP_KEYS.forEach(k=>{if(m[k]&&!o[k]&&SCHEMA[ui.form].items.some(i=>i.k===k))o[k]=m[k]});save();render()},
 forgetPrep(){if(confirm('Forget all remembered preparers for this incident? (Names already on forms stay.)')){curInc().prep={};save();render()}},
 addrow(el){const o=curObj(),it=(SCHEMA[ui.form].items).find(i=>i.k===el.dataset.k);const r=it.t==='list'?'':{};if(it.now)r[it.cols[0].k]=toLocal(new Date());o[it.k].push(r);save();render()},
 delrow(el){const o=curObj();o[el.dataset.k].splice(+el.dataset.i,1);save();render()},
 addLog(){const t=$('#logNew').value.trim();if(!t)return;const inc=curInc();inc.log.push({id:uid(),t:$('#logT').value||toLocal(new Date()),text:t,who:(inc.logger&&inc.logger.name)||''});inc.log.sort((a,b)=>(a.t||'').localeCompare(b.t||''));save();render()},
 delLog(el){if(confirm('Delete this log entry?')){curInc().log.splice(+el.dataset.i,1);save();render()}},
 printLog(){const inc=curInc();doPrint(logPage(inc),'ICS 214 - '+inc.name+(inc.number?' #'+inc.number:''))},
 printForm(){const inc=curInc(),p=curP();doPrint(formPage(ui.form,inc,p,INST.includes(ui.form)?arr(p,ui.form).find(x=>x.id===ui.inst):null),SCHEMA[ui.form].n+' - '+idTitle(inc,SCHEMA[ui.form].scope==='inc'?null:p).replace('IAP - ',''))},
 printIAP(){const inc=curInc(),p=curP();doPrint(iapHTML(inc,p),idTitle(inc,p))},
 export(){const out=(S.sigs||[]).length&&!confirm('Include the saved e-signature library in this backup?\n\nOK = include (keep the file private)\nCancel = leave the library out (signatures already on forms stay)')?Object.assign({},S,{sigs:[]}):S;const b=new Blob([JSON.stringify(out,null,1)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='iap-backup-'+toLocal(new Date()).replace(/[:T]/g,'-')+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)},
 import(){$('#imp').click()}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(el&&ACT[el.dataset.act]){e.preventDefault();ACT[el.dataset.act](el)}});
document.addEventListener('input',e=>{const t=e.target;if(t.id==='sgType'){drawTyped();return}if(t.id==='sgName'||t.id==='sgCons'){sigChk();return}
 const el=e.target,p=el.getAttribute&&el.getAttribute('data-p');if(!p)return;if(el.type==='radio'&&!el.checked)return;
 const o=curObj();if(!o)return;const pp=JSON.parse(p);setPath(o,pp,el.value);
 if(pp.length===1&&PREP_KEYS.includes(pp[0])&&remOn()&&!ui.preview){const inc=curInc();inc.prep=inc.prep||{};(inc.prep[ui.form]=inc.prep[ui.form]||{})[pp[0]]=el.value}
 if(el.closest('.rg')&&el.tagName!=='SELECT'){/* typing a name implies filled */const path=JSON.parse(p);if(path[2]==='n'){const r=o[path[0]][path[1]];if(!r.s)r.s='Filled'}}
 save();renderSide()});
document.addEventListener('change',e=>{const el=e.target;
 if(el.dataset&&el.dataset.inc){curP().include[el.dataset.inc]=el.checked;save();renderSide();return}
 if(el.id==='sgCons'){sigChk();return}
 if(el.id==='coverFile'){const f=el.files[0];el.value='';if(f)setCover(f);return}
 if(el.id==='coverAI'){curObj().ai=el.checked;save();return}
 if(el.id==='remSet'){S.settings=S.settings||{};S.settings.rememberPrep=el.checked;save();renderMain();return}
 if(el.id==='incSel'){S.cur=el.value;ui={form:'f202',inst:null,preview:false};save();render();return}
 if(el.id==='perSel'){curInc().pi=+el.value;ui.inst=null;save();render();return}
 if(el.closest&&el.closest('.rg')&&el.tagName==='SELECT')renderMain();
 if(el.id==='imp'){const f=el.files[0];if(!f)return;f.text().then(t=>{try{const s=JSON.parse(t);if(!s.incidents)throw 0;if(!confirm(`Import ${s.incidents.length} incident(s)? Incidents with the same ID will be replaced.`))return;s.incidents.forEach(i=>{const k=S.incidents.findIndex(x=>x.id===i.id);if(k>=0)S.incidents[k]=i;else S.incidents.push(i)});S.images=Object.assign({},s.images||{},S.images||{});(s.sigs||[]).forEach(g=>{S.sigs=S.sigs||[];if(!S.sigs.some(x=>x.id===g.id))S.sigs.push(g)});S.cur=S.cur||s.cur;save();render()}catch(x){alert('That file is not a valid IAP Builder backup.')}el.value=''})}});
document.addEventListener('paste',e=>{if(ui.form!=='cover'||ui.preview||!curInc())return;const it=[...(e.clipboardData&&e.clipboardData.items||[])].find(i=>i.type.startsWith('image/'));if(it){e.preventDefault();setCover(it.getAsFile())}});
document.addEventListener('dragover',e=>{const d=e.target.closest&&e.target.closest('#drop');if(d){e.preventDefault();d.classList.add('over')}});
document.addEventListener('dragleave',e=>{const d=e.target.closest&&e.target.closest('#drop');if(d)d.classList.remove('over')});
document.addEventListener('drop',e=>{const d=e.target.closest&&e.target.closest('#drop');if(d){e.preventDefault();d.classList.remove('over');const f=e.dataTransfer.files[0];if(f)setCover(f)}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.ctrlKey&&e.target.id==='logNew')ACT.addLog()});
if(!curInc())S.cur=S.incidents[0]&&S.incidents[0].id;
render();
